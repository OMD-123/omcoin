<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmCoin | Professional Asset Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.10.0/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0a0a0a; color: #fff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 30, 30, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="text-center mb-10">
        <h1 class="text-6xl font-bold text-[#d4ff00] mb-2">Money with momentum.</h1>
        <p class="text-gray-400 text-lg">OmCoin: Transparent, direct value transfer.</p>
    </div>

    <div class="glass p-8 rounded-[32px] w-full max-w-md text-center shadow-2xl">
        <div id="connectArea">
            <button id="connectBtn" class="bg-[#037ddc] hover:bg-blue-600 text-white font-bold py-4 px-8 rounded-2xl w-full text-xl transition-all transform active:scale-95">
                Connect Wallet
            </button>
        </div>

        <div id="mainArea" class="hidden flex flex-col gap-8">
            <div>
                <p class="text-gray-500 uppercase text-xs tracking-widest mb-2">Your Balance</p>
                <div class="text-5xl font-bold mb-1"><span id="balance">0.00</span> <span class="text-2xl text-gray-600">OMC</span></div>
                <p id="address" class="text-xs text-gray-600 font-mono truncate px-4"></p>
            </div>

            <div class="h-px bg-gray-800 w-full"></div>

            <div class="text-left space-y-4">
                <h3 class="text-lg font-semibold text-gray-200">Send OmCoin</h3>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-gray-500 ml-1">Recipient Address</label>
                        <input id="recipient" type="text" placeholder="0x..." class="w-full bg-[#2a2a2a] border border-gray-700 p-3 rounded-xl text-white focus:border-blue-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 ml-1">Amount (OMC)</label>
                        <input id="amount" type="number" placeholder="0.0" class="w-full bg-[#2a2a2a] border border-gray-700 p-3 rounded-xl text-white focus:border-blue-500 outline-none transition-all">
                    </div>
                    <button id="sendBtn" class="bg-[#037ddc] hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-xl w-full transition-all transform active:scale-95">
                        Send Tokens
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-8 text-gray-600 text-xs">
        OmCoin Network &bull; Sepolia Testnet &bull; 2026
    </div>

    <script>
        const CONTRACT_ADDR = "0x2745F1De48D978523b9F9357fB8BF3BFDee5E53F";
        const ABI = ["function balanceOf(address) view returns (uint256)", "function transfer(address to, uint256 amount) returns (bool)"];
        let account = null;

        async function connect() {
            if (!window.ethereum) return alert("Install MetaMask!");
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                account = accounts[0];
                document.getElementById('connectArea').classList.add('hidden');
                document.getElementById('mainArea').classList.remove('hidden');
                document.getElementById('address').innerText = account;
                updateBalance();
            } catch (e) { alert("Connection failed"); }
        }

        async function updateBalance() {
            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const contract = new ethers.Contract(CONTRACT_ADDR, ABI, provider);
                const bal = await contract.balanceOf(account);
                document.getElementById('balance').innerText = ethers.formatEther(bal);
            } catch (e) { console.error(e); }
        }

        async function send() {
            const to = document.getElementById('recipient').value;
            const amt = document.getElementById('amount').value;
            if (!to || !amt) return alert("Enter address and amount");
            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const signer = await provider.getSigner();
                const contract = new ethers.Contract(CONTRACT_ADDR, ABI, signer);
                const tx = await contract.transfer(to, ethers.parseEther(amt));
                alert("Transaction sent! Hash: " + tx.hash);
                updateBalance();
            } catch (e) { alert("Error: " + (e.reason || "Transfer failed")); }
        }

        document.getElementById('connectBtn').onclick = connect;
        document.getElementById('sendBtn').onclick = send;
    </script>
</body>
</html>
